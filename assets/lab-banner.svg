<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" role="img" aria-labelledby="title description">
  <title id="title">Laboratoire de sécurité Active Directory</title>
  <desc id="description">Bannière sombre avec accents cyan et menthe pour un laboratoire de cybersécurité Active Directory.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#142437"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#6ee7b7"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="260" rx="18" fill="url(#background)"/>
  <path d="M0 214H1200" stroke="#24384b" stroke-width="1"/>
