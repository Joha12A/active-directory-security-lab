  <text x="96" y="191" fill="#8ca3b8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" letter-spacing="1.6">CONFIGURATION · CONTRÔLES · PREUVES · REMÉDIATION</text>
  <path d="M1034 116h122M1034 132h84M1034 148h104" stroke="url(#accent)" stroke-linecap="round" stroke-width="3" opacity=".8"/>
